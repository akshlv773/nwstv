<style>
:root {
  --primary: #ff3366;
  --bg: #ffffff;
  --text: #111;
  --card-bg: #fdfdfd;
  --card-radius: 24px;
  --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
  --transition: all 0.3s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

/* Loader */
#loader {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.spinner {
  width:60px; height:60px;
  border:6px solid #f3f3f3;
  border-top:6px solid var(--primary);
  border-radius:50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

header {
  padding: 1.2rem 1rem;
  text-align:center;
  font-size:1.6rem;
  font-weight:700;
  color:#fff;
  background: linear-gradient(135deg, #ff3366, #ff80ab);
  border-bottom-left-radius:30px;
  border-bottom-right-radius:30px;
  box-shadow: var(--shadow);
  position: sticky;
  top:0;
  z-index:10;
}

main {
  flex:1;
  padding:2rem 1rem;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap:1.5rem;
  animation: fadeIn 0.5s ease-in-out;
}

.card {
  background: var(--card-bg);
  padding:2rem 1.2rem;
  border-radius: var(--card-radius);
  box-shadow: var(--shadow);
  display:flex;
  flex-direction: column;
  align-items:center;
  justify-content:center;
  text-align:center;
  transition: var(--transition);
  cursor:pointer;
  aspect-ratio:1/1;
  position:relative;
  overflow:hidden;
}

.card::after {
  content:'';
  position:absolute;
  width:120%; height:120%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), transparent);
  transform: rotate(25deg);
  top:-60%; left:-60%;
  transition: var(--transition);
  pointer-events:none;
}
.card:hover::after { top:0; left:0; }

.card span { font-size:2.8rem; margin-bottom:1rem; transition: var(--transition); }
.card p { font-size:1.1rem; font-weight:600; color:#333; letter-spacing:0.5px; transition: var(--transition); }

.card:hover {
  transform: translateY(-6px) scale(1.05);
  box-shadow: 0 16px 36px rgba(0,0,0,0.08);
  background: #fff0f6;
}
.card:hover span { transform: scale(1.2) rotate(5deg); }

/* Ripple effect */
.ripple {
  position:absolute;
  border-radius:50%;
  transform:scale(0);
  animation:ripple 0.6s linear;
  background-color: rgba(255,51,102,0.3);
  pointer-events:none;
}
@keyframes ripple { to{ transform:scale(4); opacity:0;} }

@media(max-width:768px){
  main { gap:1rem; padding:1.5rem 1rem; }
  .card { padding:1.5rem 1rem; }
  .card span { font-size:2.2rem; }
  .card p { font-size:1rem; }
  header { font-size:1.3rem; padding:1rem; }
}
@keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

/* Random GIF */
#gif-box {
  grid-column:1 / -1;
  text-align:center;
  margin-top:2rem;
}
#gif-box img {
  max-width:100%;
  border-radius:24px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
}
</style>

// Redirect

// Ripple effect
document.querySelectorAll('.card').forEach(card=>{
  card.addEventListener('click', function(e){
    const ripple = document.createElement('span');
    ripple.classList.add('ripple');
    this.appendChild(ripple);
    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = e.clientX - rect.left - size/2 + 'px';
    ripple.style.top = e.clientY - rect.top - size/2 + 'px';
    setTimeout(()=>{ ripple.remove(); },600);
  });
});
