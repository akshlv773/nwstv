<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>NWSTV</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{width:100%;max-width:1000px;margin:0 auto;padding:12px}
.video-card{width:100%;overflow:hidden;background:#fff;border:1px solid #e4e4e7;border-radius:15px;margin:0 0 14px;box-shadow:0 3px 14px rgba(0,0,0,.055)}
.player-wrap{position:relative;width:100%;height:0;padding-bottom:56.25%;background:#000}
.player-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block}
@media(min-width:720px){
 main{padding:20px}
 .video-card{display:inline-block;vertical-align:top;width:49%;margin-right:1.5%;margin-bottom:18px}
 .video-card:nth-child(2){margin-right:0}
}
</style>
</head>
<body>
<main>
<div class="video-card"><div class="player-wrap"><div id="player1"></div></div></div>
<div class="video-card"><div class="player-wrap"><div id="player2"></div></div></div>
</main>
<script>
(function(){
  var ids=['psIZiXQvGfo','BCulM89gpB8'];
  var players=[];
  var apiReady=false;
  function createPlayers(){
    if(!apiReady||!window.YT||!YT.Player){return;}
    var i;
    for(i=0;i<ids.length;i++){
      if(players[i]){continue;}
      players[i]=new YT.Player('player'+(i+1),{
        videoId:ids[i],
        playerVars:{playsinline:1,rel:0,modestbranding:1},
        events:{
          onStateChange:(function(index){
            return function(event){
              if(event.data===YT.PlayerState.PLAYING){
                var j;
                for(j=0;j<players.length;j++){
                  if(j!==index&&players[j]&&players[j].pauseVideo){players[j].pauseVideo();}
                }
              }
            };
          })(i)
        }
      });
    }
  }
  window.onYouTubeIframeAPIReady=function(){apiReady=true;createPlayers();};
  var script=document.createElement('script');
  script.src='https://www.youtube.com/iframe_api';
  script.async=true;
  var first=document.getElementsByTagName('script')[0];
  first.parentNode.insertBefore(script,first);
})();
</script>
</body>
</html>
