<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>NWSTV</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px 12px 24px}
header{padding:6px 2px 16px}
h1{font-size:20px;font-weight:650;letter-spacing:-.4px;margin:0}
.video{background:#fff;border-radius:14px;overflow:hidden;margin:0 0 14px;border:1px solid #e6e6e8}
.frame{height:0;padding-bottom:56.25%;position:relative;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.fallback{padding:10px 12px;font-size:13px}
.fallback a{color:#007aff;text-decoration:none}
@media(min-width:680px){main{padding:24px}.video{display:inline-block;vertical-align:top;width:49%;margin-right:1.5%}.video:nth-of-type(2){margin-right:0}}
</style>
</head>
<body>
<main>
<header><h1>NWSTV</h1></header>
<section class="video">
<div class="frame"><iframe src="https://www.youtube.com/embed/psIZiXQvGfo" title="NWSTV video 1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
<div class="fallback"><a href="https://www.youtube.com/watch?v=psIZiXQvGfo" target="_blank" rel="noopener">Open in YouTube ↗</a></div>
</section>
<section class="video">
<div class="frame"><iframe src="https://www.youtube.com/embed/BCulM89gpB8" title="NWSTV video 2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
<div class="fallback"><a href="https://www.youtube.com/watch?v=BCulM89gpB8" target="_blank" rel="noopener">Open in YouTube ↗</a></div>
</section>
</main>
</body>
</html>
